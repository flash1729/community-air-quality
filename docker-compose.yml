services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/airquality.db
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      OPENMETEO_FORECAST_URL: https://api.open-meteo.com/v1/forecast
      OPENMETEO_AIR_QUALITY_URL: https://air-quality-api.open-meteo.com/v1/air-quality
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-30}
      # Local demo only: hands each newly registered sensor's token to the
      # simulator below. Leave off anywhere real devices register.
      SIMULATOR_AUTO_PROVISION: "true"
      SIMULATOR_TOKENS_FILE: /app/data/sensor_tokens.json
    volumes:
      - air-data:/app/data

  # Virtual devices. Reads tokens and locations from the shared data volume and
  # posts readings to the backend's HTTP ingestion endpoint.
  simulator:
    build: ./backend
    command:
      - python
      - -u
      - -m
      - app.simulator.virtual_sensors
      - --api-url
      - http://backend:8000
      - --tokens-file
      - /app/data/sensor_tokens.json
      - --locations-file
      - /app/data/sensor_locations.json
    volumes:
      - air-data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend

  # Separate from the web process, same idea as Cloud Scheduler or EventBridge.
  # Run once with: docker compose --profile job run --rm scheduler
  scheduler:
    profiles: ["job"]
    build: ./backend
    command: python -m app.jobs.refresh_popular
    environment:
      DATABASE_URL: sqlite:////app/data/airquality.db
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      OPENMETEO_FORECAST_URL: https://api.open-meteo.com/v1/forecast
      OPENMETEO_AIR_QUALITY_URL: https://air-quality-api.open-meteo.com/v1/air-quality
    volumes:
      - air-data:/app/data

volumes:
  air-data:
